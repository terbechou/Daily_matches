<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مباريات اليوم</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .match {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .league {
            color: #087f5b;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .teams {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .time {
            color: #666;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            background: #e8f5e9;
            color: #087f5b;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ مباريات اليوم</h1>
    <p>تابع أهم مباريات كرة القدم</p>
</header>

<div class="container">

    <h2 class="title">مباريات اليوم</h2>

    <div class="match">
        <div class="league">الدوري الإنجليزي</div>
        <div class="teams">الفريق الأول × الفريق الثاني</div>
        <div class="time">20:00</div>
        <span class="status">لم تبدأ</span>
    </div>

    <div class="match">
        <div class="league">الدوري الإسباني</div>
        <div class="teams">الفريق الثالث × الفريق الرابع</div>
        <div class="time">22:00</div>
        <span class="status">لم تبدأ</span>
    </div>

</div>

<footer>
    جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
